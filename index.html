    <script>
      (function() {
        function isTfLiteLog(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || (arg.toString ? arg.toString() : ''));
          return (
            str.indexOf('TensorFlow Lite') !== -1 ||
            str.indexOf('XNNPACK') !== -1 ||
            str.indexOf('Created TensorFlow Lite XNNPACK delegate') !== -1
          );
        }

        function hasTfLiteArg(args) {
          for (var i = 0; i < args.length; i++) {
            if (isTfLiteLog(args[i])) return true;
          }
          return false;
        }

        var origErr = console.error;
        console.error = function() {
          if (hasTfLiteArg(arguments)) {
            if (console.info) {
              console.info.apply(console, arguments);
            }
            return;
          }
          return origErr.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          if (hasTfLiteArg(arguments)) {
            if (console.info) {
              console.info.apply(console, arguments);
            }
            return;
          }
          return origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && event.error.message) || '');
          if (isTfLiteLog(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
