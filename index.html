    <script>
      (function() {
        function isBenignDevError(arg) {
          if (!arg) return false;
          var str = '';
          if (typeof arg === 'string') {
            str = arg;
          } else if (arg && typeof arg === 'object') {
            str = (arg.message || '') + ' ' + (arg.stack || '') + ' ' + (arg.reason || '') + ' ' + (arg.toString ? arg.toString() : '');
          }
          return (
            str.indexOf('WebSocket closed without opened') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('WebSocket connection to') !== -1 ||
            str.indexOf('[vite] failed to connect') !== -1 ||
            str.indexOf('[vite] server connection lost') !== -1 ||
            (str.indexOf('[vite]') !== -1 && (str.indexOf('websocket') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('connection') !== -1)) ||
            str.indexOf('TensorFlow Lite') !== -1 ||
            str.indexOf('XNNPACK') !== -1 ||
            str.indexOf('Created TensorFlow Lite XNNPACK delegate') !== -1
          );
        }

        function hasBenignDevArg(args) {
          for (var i = 0; i < args.length; i++) {
            if (isBenignDevError(args[i])) return true;
          }
          return false;
        }

        var origErr = console.error;
        console.error = function() {
          if (hasBenignDevArg(arguments)) {
            if (console.debug) {
              console.debug.apply(console, arguments);
            }
            return;
          }
          return origErr.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          if (hasBenignDevArg(arguments)) {
            if (console.debug) {
              console.debug.apply(console, arguments);
            }
            return;
          }
          return origWarn.apply(console, arguments);
        };

        // Intercept unhandled promise rejections (e.g., Vite WebSocket closed without opened)
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason !== undefined ? event.reason : '');
          if (isBenignDevError(reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        // Intercept global error events
        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && (event.error.message || event.error.stack)) || '');
          if (isBenignDevError(msg)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        // Map MediaPipe CDN assets to local /wasm and /models or valid 1.0.1 paths
        (function() {
          function rewriteMediaPipeUrl(u) {
            if (typeof u !== 'string') return u;
            // Map non-existent @0.10.22/wasm or remote wasm to local /wasm files
            if (u.indexOf('@mediapipe/tasks-vision@0.10.22/wasm') !== -1 || u.indexOf('@mediapipe/tasks-vision@1.0.1/wasm') !== -1) {
              var lastSlash = u.lastIndexOf('/');
              var filename = lastSlash !== -1 ? u.substring(lastSlash + 1) : '';
              if (filename && (filename.indexOf('.js') !== -1 || filename.indexOf('.wasm') !== -1)) {
                return '/wasm/' + filename;
              }
              return '/wasm';
            }
            return u;
          }

          var origSetAttribute = HTMLScriptElement.prototype.setAttribute;
          HTMLScriptElement.prototype.setAttribute = function(name, val) {
            if (name === 'src' && typeof val === 'string') {
              val = rewriteMediaPipeUrl(val);
            }
            return origSetAttribute.call(this, name, val);
          };

          var scriptDesc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
          if (scriptDesc && scriptDesc.set) {
            var origSrcSet = scriptDesc.set;
            Object.defineProperty(HTMLScriptElement.prototype, 'src', {
              set: function(val) {
                return origSrcSet.call(this, rewriteMediaPipeUrl(val));
              },
              get: scriptDesc.get,
              configurable: true,
              enumerable: true
            });
          }

          if (typeof window !== 'undefined' && window.fetch) {
            var origFetch = window.fetch;
            window.fetch = async function(input, init) {
              var targetUrl = typeof input === 'string' ? input : (input && input.url ? input.url : '');
              var rewritten = rewriteMediaPipeUrl(targetUrl);
              var finalInput = (rewritten && rewritten !== targetUrl) ? rewritten : input;

              try {
                // Must bind to window to prevent IDL "Illegal invocation" TypeError
                return await origFetch.call(window, finalInput, init);
              } catch (fetchErr) {
                // If remote Google Storage model fetch fails (e.g. iframe sandbox/CORS/offline), fallback to local /models
                if (typeof targetUrl === 'string' && targetUrl.indexOf('gesture_recognizer.task') !== -1 && targetUrl !== '/models/gesture_recognizer.task') {
                  console.warn('Remote model fetch failed, falling back to local /models/gesture_recognizer.task');
                  return await origFetch.call(window, '/models/gesture_recognizer.task', init);
                }
                // If remote WASM fetch fails, fallback to local /wasm
                if (typeof targetUrl === 'string' && targetUrl.indexOf('.wasm') !== -1 && targetUrl.indexOf('/wasm/') === -1) {
                  var lastSlash = targetUrl.lastIndexOf('/');
                  var filename = lastSlash !== -1 ? targetUrl.substring(lastSlash + 1) : 'vision_wasm_internal.wasm';
                  console.warn('Remote WASM fetch failed, falling back to /wasm/' + filename);
                  return await origFetch.call(window, '/wasm/' + filename, init);
                }
                throw fetchErr;
              }
            };
          }
        })();
      })();
    </script>
